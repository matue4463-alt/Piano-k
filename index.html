<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Piano Interativo – Estável</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial;text-align:center}
h1{margin:12px 0}
#controls{margin:10px}
button,select,input{font-size:16px;padding:6px;margin:4px}
#piano{position:relative;width:840px;height:300px;margin:20px auto;background:#333;touch-action:none}
.white{position:absolute;width:70px;height:100%;background:#fff;border:1px solid #000;z-index:1}
.black{position:absolute;width:45px;height:60%;background:#000;z-index:2}
.active{background:#4caf50!important}
.dot{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:12px;height:12px;background:#2196f3;border-radius:50%}
.label{position:absolute;bottom:5px;width:100%;font-size:12px;color:#000}
.black .label{color:#fff}
@media(max-width:900px){#piano{width:100%;height:220px}.black{height:140px}}
</style>
</head>
<body><h1>🎹 Piano Interativo</h1>
<p>PC: A S D F G H J = brancas | W E T Y U = pretas</p><div id="controls">
  <input type="file" id="audioInput" accept="audio/*">
  <button id="convertBtn">Converter áudio</button>
  <select id="songSelect"></select>
  <button id="startSong">Começar música</button>
  <label style="margin-left:10px">
    <input type="checkbox" id="botPlay"> Bot Play
  </label>
  <select id="instrument">
    <option value="sine">Piano (Yamaha simples)</option>
    <option value="triangle">Órgão</option>
    <option value="square">Caixa de som</option>
    <option value="sawtooth">Synth</option>
  </select>
</div><div id="piano"></div>
<script>
// ===============================
// CONTEXTO DE ÁUDIO (CELULAR OK)
// ===============================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioCtx();
let osc = null;const freqs = { C:261.63,'C#':277.18,D:293.66,'D#':311.13,E:329.63, F:349.23,'F#':369.99,G:392,'G#':415.3,A:440,'A#':466.16,B:493.88, C2:523.25,'C#2':554.37,D2:587.33,'D#2':622.25,E2:659.25, F2:698.46,'F#2':739.99,G2:783.99,'G#2':830.61,A2:880,'A#2':932.33,B2:987.77 };

function play(note){ stop(); osc = audioCtx.createOscillator(); osc.type=document.getElementById('instrument')?.value||'sine'; osc.frequency.value=freqs[note]; osc.connect(audioCtx.destination); osc.start(); } function stop(){ if(osc){ try{osc.stop()}catch(e){} osc=null } }

// =============================== // CRIAR PIANO (GARANTIDO) // =============================== const piano = document.getElementById('piano');

function criarPiano(){ piano.innerHTML = ''; const notes = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B','C2','C#2','D2','D#2','E2','F2','F#2','G2','G#2','A2','A#2','B2']; let whiteIndex = 0;

notes.forEach(n=>{ const sharp = n.includes('#'); const key = document.createElement('div'); key.className = sharp ? 'black' : 'white'; key.dataset.note = n;

if(!sharp){ key.style.left = (whiteIndex*70)+'px'; whiteIndex++; }
else{ key.style.left = ((whiteIndex*70)-22)+'px'; }

const label = document.createElement('div');
label.className='label'; label.textContent=n;
key.appendChild(label);

key.addEventListener('pointerdown',()=>{ audioCtx.resume(); play(n); key.classList.add('active'); checkGuide(n); });
key.addEventListener('pointerup',()=>{ stop(); key.classList.remove('active'); });
key.addEventListener('pointerleave',()=>{ stop(); key.classList.remove('active'); });

piano.appendChild(key);

}); }

window.onload = criarPiano;

// =============================== // GUIA + BOT PLAY // =============================== let guide = []; let gi = 0; let botInterval = null;

function showDot(){ document.querySelectorAll('.dot').forEach(d=>d.remove()); if(gi>=guide.length) return; const k=[...piano.children].find(x=>x.dataset.note===guide[gi]); if(k){ const d=document.createElement('div'); d.className='dot'; k.appendChild(d); }}

function checkGuide(note){ if(!document.getElementById('botPlay').checked && guide[gi]===note){ gi++; showDot(); }}

function highlight(note){ [...piano.children].forEach(k=>k.classList.remove('active')); const k=[...piano.children].find(x=>x.dataset.note===note); if(k) k.classList.add('active'); }

// =============================== // MÚSICAS PRONTAS // =============================== const songs = { 'His Theme (Undertale)': ['G','A','C2','D2','C2','A','G','E','G','A','C2'], 'Fallen Down (simplificado)': ['C','E','G','A','G','E','C','D','E'], 'Tutorial': ['C','D','E','F','G','A','B','C2'] };

const songSelect = document.getElementById('songSelect'); Object.keys(songs).forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; songSelect.appendChild(o); });

startSong.onclick = ()=>{ guide = [...songs[songSelect.value]]; gi = 0; clearInterval(botInterval); showDot(); if(botPlay.checked){ botInterval = setInterval(()=>{ if(gi>=guide.length){clearInterval(botInterval);return;} play(guide[gi]); highlight(guide[gi]); gi++; showDot(); },600); } };

// =============================== // CONVERSÃO COM ACORDES (EDUCACIONAL) // =============================== convertBtn.onclick = async()=>{ const file = audioInput.files[0]; if(!file) return alert('Escolha um áudio'); audioCtx.resume(); const buf = await audioCtx.decodeAudioData(await file.arrayBuffer()); const data = buf.getChannelData(0); guide = []; const scale = ['C','D','E','F','G','A','B']; for(let i=0;i<data.length;i+=buf.sampleRate/2){ if(Math.abs(data[i])>0.25){ const root = scale[Math.floor(Math.random()*scale.length)]; guide.push(root, scale[(scale.indexOf(root)+2)%7], scale[(scale.indexOf(root)+4)%7]); }} gi=0; showDot(); };

// =============================== // TECLADO PC (QWERTY + NÚMEROS) // =============================== const keyMap={ q:'C',w:'D',e:'E',r:'F',t:'G',y:'A',u:'B',i:'C2', '2':'C#','3':'D#','5':'F#','6':'G#','7':'A#' };

document.addEventListener('keydown',e=>{ if(e.repeat)return; const n=keyMap[e.key]; if(!n)return; audioCtx.resume(); play(n); highlight(n); checkGuide(n); }); document.addEventListener('keyup',()=>{ stop(); [...piano.children].forEach(k=>k.classList.remove('active')); }); </script>

<script>
// ===== AUDIO (FUNCIONA EM CELULAR) =====
const AudioCtx=window.AudioContext||window.webkitAudioContext;
const audioCtx=new AudioCtx();
let osc=null;
const freqs={
 C:261.63,'C#':277.18,D:293.66,'D#':311.13,E:329.63,F:349.23,'F#':369.99,G:392,'G#':415.3,A:440,'A#':466.16,B:493.88,
 C2:523.25,'C#2':554.37,D2:587.33,'D#2':622.25,E2:659.25,F2:698.46,'F#2':739.99,G2:783.99,'G#2':830.61,A2:880,'A#2':932.33,B2:987.77
};

function highlightKey(note){document.querySelectorAll('#piano div').forEach(k=>k.classList.remove('active'));const k=document.querySelector(`#piano div[data-note="${note}"]`);if(k)k.classList.add('active')}

function play(note){stop();osc=audioCtx.createOscillator();osc.type=document.getElementById('instrument').value;osc.frequency.value=freqs[note];osc.connect(audioCtx.destination);osc.start()}
function stop(){if(osc){try{osc.stop()}catch(e){}osc=null}}

// ===== CRIAR PIANO =====
const piano=document.getElementById('piano');
const layout=[
 {n:'C',s:0},{n:'C#',s:1},{n:'D',s:0},{n:'D#',s:1},{n:'E',s:0},
 {n:'F',s:0},{n:'F#',s:1},{n:'G',s:0},{n:'G#',s:1},{n:'A',s:0},{n:'A#',s:1},{n:'B',s:0},
 {n:'C2',s:0},{n:'C#2',s:1},{n:'D2',s:0},{n:'D#2',s:1},{n:'E2',s:0},
 {n:'F2',s:0},{n:'F#2',s:1},{n:'G2',s:0},{n:'G#2',s:1},{n:'A2',s:0},{n:'A#2',s:1},{n:'B2',s:0}
];
let w=0;
layout.forEach(o=>{
 const k=document.createElement('div');k.className=o.s?'black':'white';k.dataset.note=o.n;
 if(!o.s){k.style.left=(w*70)+'px';w++}else{k.style.left=((w*70)-22)+'px'}
 const l=document.createElement('div');l.className='label';l.textContent=o.n;k.appendChild(l);
 piano.appendChild(k);
});

// ===== INTERAÇÃO MOUSE / TOQUE =====
document.querySelectorAll('#piano div').forEach(k=>{
 k.addEventListener('pointerdown',()=>{audioCtx.resume();play(k.dataset.note);k.classList.add('active')});
 k.addEventListener('pointerup',()=>{stop();k.classList.remove('active')});
 k.addEventListener('pointerleave',()=>{stop();k.classList.remove('active')});
});

// ===== TECLADO PC (QWERTY + NÚMEROS) =====
const keyMap={
 'q':'C','w':'D','e':'E','r':'F','t':'G','y':'A','u':'B','i':'C2',
 '2':'C#','3':'D#','5':'F#','6':'G#','7':'A#'
};

document.addEventListener('keydown',e=>{
 if(e.repeat)return;
 const n=keyMap[e.key];
 if(!n)return;
 audioCtx.resume();
 play(n);
 highlightKey(n);
 if(!document.getElementById('botPlay').checked && guide[gi]===n){gi++;showDot()}
});

document.addEventListener('keyup',()=>{stop();document.querySelectorAll('#piano div').forEach(k=>k.classList.remove('active'))});',()=>{stop();document.querySelectorAll('#piano div').forEach(k=>k.classList.remove('active'))});

// ===== MÚSICAS PRONTAS (ENSINO) =====
const songs={
 'His Theme (Undertale)': ['G','A','C2','D2','C2','A','G','E','G','A','C2'],
 'Hopes and Dreams': ['E','G','A','C2','A','G','E','D','E','G'],
 'Tutorial': ['C','D','E','F','G','A','B','C2']
};
Object.keys(songs).forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;songSelect.appendChild(o)});

// ===== CONVERSÃO + GUIA =====
let guide=[];let gi=0;let botInterval=null; // gerado do áudio
 const map=['C','D','E','F','G','A','B','C2'];let gi=0;
function showDot(){document.querySelectorAll('.dot').forEach(d=>d.remove());if(gi>=guide.length)return;const k=[...document.querySelectorAll('#piano div')].find(x=>x.dataset.note===guide[gi]);if(k){const d=document.createElement('div');d.className='dot';k.appendChild(d)}}

document.getElementById('startSong').onclick=()=>{
 guide=[...songs[songSelect.value]];
 gi=0;
 clearInterval(botInterval);
 showDot();
 if(document.getElementById('botPlay').checked){
   botInterval=setInterval(()=>{
     if(gi>=guide.length){clearInterval(botInterval);return}
     play(guide[gi]);
     highlightKey(guide[gi]);
     gi++;
     showDot();
   },600);
 }
};gi=0;showDot();localStorage.setItem('lastSong',songSelect.value)};

document.getElementById('convertBtn').onclick=async()=>{
 const file=document.getElementById('audioInput').files[0];if(!file)return alert('Escolha um áudio');
 audioCtx.resume();
 const buf=await audioCtx.decodeAudioData(await file.arrayBuffer());
 const data=buf.getChannelData(0);
 guide=[];
 for(let i=0;i<data.length;i+=buf.sampleRate/3){if(Math.abs(data[i])>0.2)guide.push(map[Math.floor(Math.random()*map.length)])}
 gi=0;showDot();
};

// avançar guia quando nota correta
document.addEventListener('pointerdown',e=>{
 if(!e.target.dataset||!e.target.dataset.note)return;
 if(e.target.dataset.note===guide[gi]){gi++;showDot()}
});
</script></body>
</html>
